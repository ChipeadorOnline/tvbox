services:
  api:
    build:
      context: ../server
    env_file:
      - ../server/.env
    environment:
      PORT: 3000
      VIRTUAL_HOST: ${API_DOMAIN}
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: ${API_DOMAIN}
    restart: unless-stopped

  proxy:
    image: ghcr.io/nginx-proxy/nginx-proxy:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
    restart: unless-stopped

  acme:
    image: ghcr.io/nginx-proxy/nginx-proxy-acme:latest
    volumes:
      - ./certs:/etc/nginx/certs
      - ./acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DEFAULT_EMAIL: ${ACME_EMAIL}
    restart: unless-stopped

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APK para TV Box - ChipeadorOnline</title>
<style>
  :root {
    --fondo: #070e14;
    --panel: #111d28;
    --panel-foco: #192d40;
    --texto: #f1f5f9;
    --suave: #839bb0;
    --foco: #38bdf8;
    --acento: #0ea5e9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--fondo);
    color: var(--texto);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 40px 32px 64px;
    background-image: 
      radial-gradient(circle at 15% 15%, #102638 0%, transparent 40%),
      radial-gradient(circle at 85% 85%, #0c1a26 0%, transparent 40%);
  }
  main { max-width: 1200px; margin: 0 auto; }
  
  header {
    margin-bottom: 32px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding-bottom: 20px;
  }
  h1 { font-size: 2.4rem; margin: 0 0 8px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
  .sub { color: var(--suave); font-size: 1.15rem; margin: 0; line-height: 1.5; max-width: 70ch; }

  #aviso {
    display: none;
    background: #422006;
    border: 2px solid #f59e0b;
    border-radius: 12px;
    padding: 16px 20px;
    margin: 0 0 24px;
    font-size: 1.1rem;
  }
  #estado {
    min-height: 1.8em;
    margin: 0 0 24px;
    color: var(--foco);
    font-size: 1.15rem;
    font-weight: 500;
  }

  /* Grilla de aplicaciones perfectamente simétrica */
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
  }

  a.apk {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: var(--panel);
    color: var(--texto);
    text-decoration: none;
    border-radius: 16px;
    border: 2px solid rgba(255, 255, 255, 0.05);
    padding: 24px;
    min-height: 155px; /* Altura fija para mantener todos los cubos idénticos */
    box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.4);
    transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .contenido-tarjeta {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
  }

  a.apk .nombre {
    display: block;
    font-size: 1.25rem;
    font-weight: 600;
    line-height: 1.4;
    word-break: break-word;
    color: #fff;
    margin-bottom: 16px;
  }

  .pie-tarjeta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: auto;
  }

  a.apk small {
    display: inline-block;
    padding: 6px 12px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--suave);
  }

  .icono-descarga {
    font-size: 1.1rem;
    color: var(--foco);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Efecto Foco / Hover optimizado para control remoto en TV Box */
  a.apk:hover,
  a.apk:focus {
    outline: none;
    border-color: var(--foco);
    background: var(--panel-foco);
    transform: translateY(-4px);
    box-shadow: 0 15px 30px -5px rgba(56, 189, 248, 0.25);
  }

  a.apk:hover .icono-descarga,
  a.apk:focus .icono-descarga {
    color: #fff;
  }

  /* Pie de página y donaciones */
  #pie {
    margin-top: 60px;
    padding-top: 30px;
    border-top: 1px solid rgba(255,255,255,0.08);
    text-align: center;
  }
  #pie p { color: var(--suave); font-size: 1.1rem; margin: 0 0 16px; }
  #pie .alias { color: var(--foco); font-size: 1.4rem; font-weight: 700; margin: 16px 0 0; }
  
  a.dona {
    display: inline-block;
    padding: 14px 28px;
    background: var(--panel);
    color: var(--texto);
    text-decoration: none;
    font-size: 1.2rem;
    font-weight: 600;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.1);
    transition: all 0.2s ease;
  }
  a.dona:hover,
  a.dona:focus {
    outline: none;
    border-color: var(--foco);
    background: var(--panel-foco);
  }

  @media (max-width: 520px) {
    body { padding: 20px 16px; }
    h1 { font-size: 2rem; }
    a.apk .nombre { font-size: 1.1rem; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>APK para TV Box</h1>
    <p class="sub">Elegí una aplicación con el control remoto. Se descarga de forma automática para instalarla en tu dispositivo.</p>
  </header>

  <div id="aviso"></div>
  <div id="estado" role="status" aria-live="polite"></div>
  <ul id="lista"></ul>
  <footer id="pie" style="display:none"></footer>
</main>

<script>
  var CONFIG = {
    usuario: "chipeadoronline",
    repo: "tvbox",
    tag: "v1",

    // Nombres limpios personalizados para tus APKs
    nombres: {
      "001.-.FCTV33_Premium_v3.0.318.apk": "FCTV33 Premium ( Deportes )",
      "002.-.Magma.Sin.VPN.apk": "Magma Sin VPN",
      "003.-.AutoVpn.aaa.28-05.apk": "AutoVpn",
      "004.-.Urban_VPN-FULL1.0.95.apk": "Urban VPN",
      "005.-.Xuper.Hydra.Nuevo.HDR.apk": "Xuper Hydra HDR",
      "007.-.MagLink-Flow-TV.apk": "MagLink Flow TV",
      "007.-.smarttube_stable.apk": "SmartTube",
      "008.-.X-plore.Pro.v4.48.05.-.androforever.com.apk": "X-plore Pro",
      "009.-.downloader.apk": "Downloader",
      "010.-.T.e.l.e.App.1.7.26.apk": "Tele App",
      "011.-.GeeSports_V3.apk": "GeeSports ( Deportes )",
      "012.-.Disney.+.apk": "Disney+ Oficial",
      "013.-.SaltamontesLite-v1.1.0.apk": "Saltamontes Lite",
      "014.-.xrtn.apk": "XRTN",
      "015.-.XuperNoF_emagoplay_14.sept.apk": "Xuper NoF",
      "016.-.SendFiles.apk": "SendFiles",
      "017.-.XuperOficial4.99.20.apk": "Xuper Oficial usa vpn",
      "018.-.XuperXao25.apk": "XuperXao25 sin Vpn Arg",
      "Net.Flix.Mod+_1.4.4.apk": "NetFlix Mod+",
      "CricZ.TV.v7.3.apk": "CricZTV (Deportes)",
      "PUCHERO.playtv.apk": "PlayTv Premium"
    },

    donacion: {
      url: "",
      texto: "Apoyar este proyecto",
      alias: "chipeadoronline.mp"
    },

    apps: []
  };

  (function () {
    var lista = document.getElementById("lista");
    var estado = document.getElementById("estado");
    var aviso = document.getElementById("aviso");

    var base = "https://github.com/" +
      encodeURIComponent(CONFIG.usuario) + "/" +
      encodeURIComponent(CONFIG.repo) + "/releases/download/" +
      encodeURIComponent(CONFIG.tag) + "/";

    var urlApi = "https://api.github.com/repos/" +
      encodeURIComponent(CONFIG.usuario) + "/" +
      encodeURIComponent(CONFIG.repo) + "/releases/tags/" +
      encodeURIComponent(CONFIG.tag);

    function sinExtension(archivo) {
      return archivo.replace(/\.apk$/i, "");
    }

    function nombreLindo(archivo) {
      if (CONFIG.nombres && CONFIG.nombres[archivo]) { return CONFIG.nombres[archivo]; }
      var n = sinExtension(archivo).replace(/[_\-.]+/g, " ").replace(/\s+/g, " ").trim();
      if (!n) { n = archivo; }
      return n.charAt(0).toUpperCase() + n.slice(1);
    }

    function pesoTexto(bytes) {
      if (!bytes) { return ""; }
      return (bytes / 1048576).toFixed(1) + " MB";
    }

    function crearBoton(app) {
      var nombre = nombreLindo(app.archivo);
      var peso = pesoTexto(app.size);

      var li = document.createElement("li");
      var a = document.createElement("a");
      a.className = "apk";
      a.href = base + encodeURIComponent(app.archivo);
      a.setAttribute("download", app.archivo);

      // Estructura interna para garantizar bloques idénticos y alineados
      var contenedor = document.createElement("div");
      contenedor.className = "contenido-tarjeta";

      var spanNombre = document.createElement("span");
      spanNombre.className = "nombre";
      spanNombre.textContent = nombre;
      contenedor.appendChild(spanNombre);

      var pieTarjeta = document.createElement("div");
      pieTarjeta.className = "pie-tarjeta";

      if (peso) {
        var chico = document.createElement("small");
        chico.textContent = peso;
        pieTarjeta.appendChild(chico);
      }

      var icono = document.createElement("span");
      icono.className = "icono-descarga";
      icono.innerHTML = "Descargar ↓";
      pieTarjeta.appendChild(icono);

      contenedor.appendChild(pieTarjeta);
      a.appendChild(contenedor);

      a.addEventListener("click", function () {
        estado.textContent = "Descargando " + nombre + ". Cuando termine, abrila desde Descargas para instalarla.";
      });

      li.appendChild(a);
      lista.appendChild(li);
    }

    function mostrar(apps) {
      lista.innerHTML = "";
      apps.forEach(crearBoton);
      var primero = lista.querySelector("a.apk");
      if (primero) { primero.focus(); }
    }

    function usarRespaldo(motivo) {
      var respaldo = (CONFIG.apps || []).map(function (x) {
        return { archivo: x.archivo, size: 0 };
      });
      if (respaldo.length) {
        estado.textContent = "";
        mostrar(respaldo);
      } else {
        estado.textContent = motivo;
      }
    }

    function armarPie() {
      var d = CONFIG.donacion;
      if (!d || (!d.url && !d.alias)) { return; }
      var pie = document.getElementById("pie");
      if (d.url) {
        var p = document.createElement("p");
        p.textContent = "Si esta página te sirve, podés colaborar con una donación.";
        pie.appendChild(p);
        var b = document.createElement("a");
        b.className = "dona";
        b.href = d.url;
        b.target = "_blank";
        b.rel = "noopener";
        b.textContent = d.texto || "Donar";
        pie.appendChild(b);
      }
      if (d.alias) {
        var al = document.createElement("p");
        al.className = "alias";
        al.textContent = "Alias: " + d.alias;
        pie.appendChild(al);
      }
      pie.style.display = "block";
    }
    armarPie();

    estado.textContent = "Cargando lista de aplicaciones...";

    var xhr = new XMLHttpRequest();
    xhr.open("GET", urlApi, true);
    xhr.setRequestHeader("Accept", "application/vnd.github+json");
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) { return; }
      if (xhr.status !== 200) {
        usarRespaldo("No se pudo leer la lista de GitHub (revisá usuario, repo y tag, y que la Release esté publicada).");
        return;
      }
      var datos;
      try { datos = JSON.parse(xhr.responseText); } catch (e) { datos = null; }
      var assets = (datos && datos.assets) ? datos.assets : [];
      var apps = assets
        .filter(function (as) { return /\.apk$/i.test(as.name); })
        .map(function (as) { return { archivo: as.name, size: as.size }; })
        .sort(function (x, y) {
          return x.archivo.toLowerCase() < y.archivo.toLowerCase() ? -1 : 1;
        });
      if (!apps.length) {
        usarRespaldo("La Release no tiene archivos .apk todavía.");
        return;
      }
      estado.textContent = "";
      mostrar(apps);
    };
    xhr.onerror = function () {
      usarRespaldo("No se pudo conectar con GitHub. Revisá la conexión a internet.");
    };
    xhr.send();

    /* Navegación fluida con flechas del control remoto de la TV Box */
    document.addEventListener("keydown", function (e) {
      var k = e.keyCode;
      if (k < 37 || k > 40) { return; }
      var links = [].slice.call(document.querySelectorAll("a.apk, a.dona"));
      if (!links.length) { return; }
      var act = document.activeElement;
      if (links.indexOf(act) < 0) {
        links[0].focus();
        e.preventDefault();
        return;
      }
      var r = act.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var mejor = null, mejorD = 1e9;
      links.forEach(function (l) {
        if (l === act) { return; }
        var q = l.getBoundingClientRect();
        var dx = (q.left + q.width / 2) - cx;
        var dy = (q.top + q.height / 2) - cy;
        var horiz = (k === 37 || k === 39);
        var ok = (k === 37) ? dx < -5 : (k === 39) ? dx > 5 : (k === 38) ? dy < -5 : dy > 5;
        if (!ok) { return; }
        var principal = horiz ? Math.abs(dx) : Math.abs(dy);
        var cruzado = horiz ? Math.abs(dy) : Math.abs(dx);
        var d = principal + cruzado * 3;
        if (d < mejorD) { mejorD = d; mejor = l; }
      });
      if (mejor) { mejor.focus(); }
      e.preventDefault();
    });
  })();
</script>
</body>
</html>
